# Lid and power key come from the EC (cros_ec_buttons: SW_LID, KEY_POWER), which also wakes the system from deep
# sleep. Like ChromeOS: closing the lid or a short press on the power key suspends; holding the key powers off
# (holding it for about 8 s makes the EC cut the power itself).
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandlePowerKey=suspend
HandlePowerKeyLongPress=poweroff
