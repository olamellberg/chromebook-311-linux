# The kenzo DMIC is mono on the first channel (the second is digital silence) and quiet: speech peaks around
# -42 dBFS, ChromeOS lists IntrinsicSensitivity -3200 and adds gain in software. This virtual source takes FL from
# the UCM "Mic" source, adds 20 dB and offers it as a mono microphone, made the default by its priority.
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Internal Microphone"
      media.name       = "Internal Microphone"
      filter.graph = {
        nodes   = [ { type = builtin name = gain label = mixer control = { "Gain 1" = 10.0 } } ]
        inputs  = [ "gain:In 1" ]
        outputs = [ "gain:Out" ]
      }
      capture.props = {
        node.name        = "capture.internal_mic"
        audio.position   = [ FL ]
        stream.dont-remix = true
        target.object    = "alsa_input.platform-mt8183-sound.HiFi__Mic__source"
        node.passive     = true
      }
      playback.props = {
        node.name        = "internal_mic"
        media.class      = "Audio/Source"
        audio.position   = [ MONO ]
        priority.session = 2100
      }
    }
  }
]
