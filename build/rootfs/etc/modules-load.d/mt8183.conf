# mediatek-cpufreq matches the machine compatible (the DT root), which sends no uevent, so udev never loads it.
# Without it there is no CPU frequency scaling, and mtk-ccifreq and mtk-svs keep deferring.
# mtk-ccifreq also needs the passive devfreq governor; nothing re-probes it if that loads late, so load it first.
governor_passive
mediatek-cpufreq
