# The UCM profile (alsa-ucm-conf mt8183_mt6358_ts3a227_max98357) has no JackControl, so every port is "availability
# unknown" and WirePlumber picks the highest priority profile: headphones + headset mic. Prefer the built-in
# speaker and microphone; a stored per-user choice (pavucontrol) still wins.
device.profile.priority.rules = [
  {
    matches = [ { device.name = "alsa_card.platform-mt8183-sound" } ]
    actions = { update-props = { priorities = [ "HiFi (Mic, Speaker)" ] } }
  }
]
