# Two DRM cards: mediatek-drm (display, no GPU) and panfrost (GPU, no display). Xorg picks panfrost as primary,
# finds no display there and fails with "Cannot run in framebuffer mode". Make the display card primary; Mesa's
# kmsro (mediatek_dri.so) renders on panfrost.
Section "OutputClass"
    Identifier "mediatek-drm"
    MatchDriver "mediatek"
    Driver     "modesetting"
    Option     "PrimaryGPU" "true"
EndSection
