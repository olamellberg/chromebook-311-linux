# Load order for the MT8183 display path, after Debian MR !906 (tested on cozmo, a jacuzzi sibling):
# https://salsa.debian.org/kernel-team/linux/-/merge_requests/906
# Its pwrap/mt6397/mt6358 lines are left out: those drivers are built in (=y) in Debian 6.12.
softdep mtk_iommu pre: mtk-smi
softdep mediatek-drm pre: mtk_iommu clk_mt8183_mm
softdep phy_mtk_mipi_dsi_drv pre: nvmem_mtk_efuse
